worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    log_format request_url '[$time_local] $remote_addr '
                           '"$request_method $scheme://$host$request_uri" $status';
    access_log /dev/stdout request_url;
    resolver ${NGINX_LOCAL_RESOLVERS};

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /app/generated/default.crt;
        ssl_certificate_key /app/generated/default.key;

        return 520;
    }

    include /app/generated/configs/*.conf;
}
